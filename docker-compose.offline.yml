services:
  label-fast:
    image: label-fast:latest
    container_name: label-fast
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/BERT:/app/backend/BERT
      - ./backend/.env:/app/backend/.env
      - ./backend/图像标注器/待标注图像文件夹:/app/backend/图像标注器/待标注图像文件夹
      - ./backend/图像标注器/标注后图像保存文件夹:/app/backend/图像标注器/标注后图像保存文件夹
    restart: unless-stopped
